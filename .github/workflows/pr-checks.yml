# Checks pull requests before they reach master, where jekyll.yml deploys the site.
name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  publish-json:
    name: Spectral Suite update-check JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate spectral_suite_publish.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_publish_json.py spectral_suite_publish.json --base-ref "origin/${{ github.base_ref }}"

  build:
    name: Jekyll build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        # Same pinned action and Ruby as jekyll.yml
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
